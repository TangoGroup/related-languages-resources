- id: '140949'
  ref: MRK 1:2
  type_id: figs-idiom
  source_text: πρὸ προσώπου σου
  translation: before your face
  original_comment: 'Here, the phrase **before your face** means in front of the person. Alternate translation: [in front of you] or [before I send you]'
  comments:
  - comment: Here, the phrase before your face means in front of the person.
    alternate_translations:
    - in front of you
    - before I send you
