name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        task: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev environment
        run: uv sync --extra dev --extra demo

      - name: Lint (ruff)
        if: matrix.task == 'lint'
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck (mypy)
        if: matrix.task == 'typecheck'
        run: uv run mypy

      - name: Test (pytest)
        if: matrix.task == 'test'
        run: uv run pytest --cov --cov-report=term
