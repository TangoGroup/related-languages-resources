[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlr"
version = "0.1.0"
description = "Related Languages Resources: surface Bible translation resources from closely-related languages to translators doing QA."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Gloo", email = "noreply@gloo.us" },
]
keywords = ["bible-translation", "related-languages", "back-translation", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "bible-figures-of-speech>=0.1",
]

[project.scripts]
rlr = "rlr.cli:app"

[project.optional-dependencies]
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
mt = [
    # 5.17 generated garbage for MADLAD-400 (T5); 5.19 is correct and clears the 5.x advisories.
    "transformers>=5.19",
    "torch>=2.3",
    "sentencepiece>=0.2",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "httpx2>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/TangoGroup/related-languages-resources"
Issues = "https://github.com/TangoGroup/related-languages-resources/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rlr"]

[tool.hatch.build.targets.sdist]
include = ["src/rlr", "tests", "docs", "BRIEF.md", "LICENSE", "NOTICE", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PL",   # pylint subset
    "PT",   # pytest style
    "TID",  # tidy-imports
    "TCH",  # flake8-type-checking
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401",  # allow Any in narrow cases
    "PLR0913", # arg count noise; revisit per-call-site
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004", "S101", "E501", "RUF001", "PLC0415"]
# typer declares options as call-in-default; commands take many keyword options.
"src/rlr/cli.py" = ["B008", "PLR0917", "PLR0913"]
"src/rlr/demo/server.py" = ["B008", "PLR0917", "PLR0913"]
# The recorder is a script, not library code: untyped Playwright handles, subprocess calls.
"demo/*.py" = ["ANN401", "S603", "S607", "PLR0915", "E402", "E501", "TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["src/rlr"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
